<text x="60" y="862" class="head">加工与装配备注</text>
<text x="60" y="890" class="small">1. 一般尺寸建议 ±0.1；接触面平面度、孔系/定位杯同轴要求建议 0.05，待加工方确认基准与检验方案。</text>
<text x="60" y="913" class="small">2. 定位杯及销孔不适用一般 ±0.1：须实测电机/定位销后确认配合；去毛刺、锐边倒钝，保留静壳避让间隙。</text>
<text x="60" y="936" class="small">3. M3×6 名义入电机牙3.5；M4×10 贯穿本片并入 hip 牙4 mm（无垫圈），不使用内侧螺母。</text>
<text x="60" y="959" class="small">4. 电机孔系依据供应商 J4310 STEP / 二维图；详见 INTERFACES.md。本版未完成冲击、疲劳及加工公差闭环验证。</text>
