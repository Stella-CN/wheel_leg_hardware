<text x="60" y="107" font-size="20" font-weight="400" fill="#24364b" text-anchor="start">右腿 Y 坐标 / mm。紫色为 CNC 6061-T6；绿、红、青色为 PETG。轴承为 NSK 686AZZ1。</text>
