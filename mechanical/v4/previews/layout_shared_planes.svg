<rect x="1075" y="523" width="125" height="31" rx="4" fill="#9185d1" stroke="#54677c"/>
<text x="1215" y="546" font-size="18" font-weight="400" fill="#24364b" text-anchor="start">165–170 / 厚 5</text>
<text x="60" y="628" font-size="23" font-weight="650" fill="#24364b" text-anchor="start">同层 ≠ 相交：OB / OA / CW 外件在 XZ 平面各占不同位置；外耳无需再向外堆叠。</text>
<text x="60" y="663" font-size="20" font-weight="400" fill="#24364b" text-anchor="start">OA 中心盘嵌入到 Y=165，沉孔底 Y=167，保留 2 mm 铝承压层；A 两耳各厚 3 mm。</text>
