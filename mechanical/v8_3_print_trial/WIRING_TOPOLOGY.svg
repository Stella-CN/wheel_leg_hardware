<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1240" viewBox="0 0 1560 1240">
<title>V8.2 power and communications functional topology</title>
<desc>Separate battery power, CAN buses, USB ports and DisplayPort video. Proposed wiring is pending PCB pinout and electrical ratings verification.</desc>
<defs><marker id="bat" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#c33c38"/></marker><marker id="dc" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#c78520"/></marker><marker id="usb" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#2776be"/></marker><marker id="can" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#1c8967"/></marker><marker id="video" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#7657a8"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif"><text x="38" y="42" font-size="30" fill="#233444" font-weight="700" text-anchor="start">V8.2  电源与通信功能拓扑</text><text x="38" y="73" font-size="17" fill="#607183" font-weight="400" text-anchor="start">后部四口 USB 外露 · 顶部自锁开关 · 后部右下充电口 · 不改变腿部机构</text><rect x="28" y="95" width="1504" height="315" rx="14" fill="#f7f9fc" stroke="#e0e7ed"/><text x="52" y="128" font-size="20" fill="#8495a5" font-weight="600" text-anchor="start">01</text><text x="96" y="128" font-size="22" fill="#233444" font-weight="600" text-anchor="start">电源分配</text><text x="96" y="155" font-size="15" fill="#607183" font-weight="400" text-anchor="start">粗线代表供电正负线对；箭头表示连接路径，不代表充电能量方向。板端引脚与额定值待核实。</text><rect x="54" y="220" width="186" height="76" rx="8" fill="#fff" stroke="#cad4dd"/><text x="147.0" y="249" font-size="18" fill="#c33c38" font-weight="600" text-anchor="middle">E626S 电池</text><text x="147.0" y="273" font-size="14" fill="#68788a" font-weight="400" text-anchor="middle">22.2 V / 满充 25.2 V</text><rect x="293" y="220" width="178" height="76" rx="8" fill="#fff" stroke="#cad4dd"/><text x="382.0" y="249" font-size="18" fill="#233444" font-weight="600" text-anchor="middle">DC 一分二</text><text x="382.0" y="273" font-size="14" fill="#68788a" font-weight="400" text-anchor="middle">5.5 × 2.1 充放共口</text><rect x="526" y="169" width="174" height="76" rx="8" fill="#fff" stroke="#cad4dd"/><text x="613.0" y="198" font-size="18" fill="#233444" font-weight="600" text-anchor="middle">顶部 M16 开关</text><text x="613.0" y="222" font-size="14" fill="#68788a" font-weight="400" text-anchor="middle">自锁 · DC 额定待核实</text><rect x="526" y="306" width="174" height="76" rx="8" fill="#fff" stroke="#cad4dd"/><text x="613.0" y="335" font-size="18" fill="#233444" font-weight="600" text-anchor="middle">后部右下充电口</text><text x="613.0" y="359" font-size="14" fill="#68788a" font-weight="400" text-anchor="middle">位于开关之前</text><rect x="773" y="169" width="191" height="76" rx="8" fill="#fff" stroke="#cad4dd"/><text x="868.5" y="198" font-size="18" fill="#233444" font-weight="600" text-anchor="middle">用户分配 PCB</text><text x="868.5" y="222" font-size="14" fill="#68788a" font-weight="400" text-anchor="middle">铜箔网络 / 线序待核实</text><rect x="1042" y="169" width="215" height="76" rx="8" fill="#fff" stroke="#cad4dd"/><text x="1149.5" y="198" font-size="18" fill="#c33c38" font-weight="600" text-anchor="middle">左右腿 · 六台电机</text><text x="1149.5" y="222" font-size="14" fill="#68788a" font-weight="400" text-anchor="middle">电源电气并联</text><rect x="773" y="306" width="191" height="76" rx="8" fill="#fff" stroke="#cad4dd"/><text x="868.5" y="335" font-size="18" fill="#233444" font-weight="600" text-anchor="middle">24→19 V 转换器</text><text x="868.5" y="359" font-size="14" fill="#68788a" font-weight="400" text-anchor="middle">图示 58 × 25 × 20</text><rect x="1042" y="306" width="215" height="76" rx="8" fill="#fff" stroke="#cad4dd"/><text x="1149.5" y="335" font-size="18" fill="#c78520" font-weight="600" text-anchor="middle">Jetson DC 输入</text><text x="1149.5" y="359" font-size="14" fill="#68788a" font-weight="400" text-anchor="middle">插头 5.5 × 2.5</text><path d="M 240,258 L 293,258" fill="none" stroke="#c33c38" stroke-width="3" stroke-linejoin="round" marker-end="url(#bat)"/><path d="M 471,258 L 496,258 L 496,207 L 526,207" fill="none" stroke="#c33c38" stroke-width="3" stroke-linejoin="round" marker-end="url(#bat)"/><path d="M 496,258 L 496,344 L 526,344" fill="none" stroke="#c33c38" stroke-width="3" stroke-linejoin="round" marker-end="url(#bat)"/><path d="M 700,207 L 773,207" fill="none" stroke="#c33c38" stroke-width="3" stroke-linejoin="round" marker-end="url(#bat)"/><path d="M 734,207 L 734,344 L 773,344" fill="none" stroke="#c33c38" stroke-width="3" stroke-linejoin="round" marker-end="url(#bat)"/><path d="M 964,207 L 1042,207" fill="none" stroke="#c33c38" stroke-width="3" stroke-linejoin="round" marker-end="url(#bat)"/><path d="M 964,344 L 1042,344" fill="none" stroke="#c78520" stroke-width="3" stroke-linejoin="round" marker-end="url(#dc)"/><text x="1300" y="193" font-size="16" fill="#c33c38" font-weight="600" text-anchor="start">电机顺接 ≠ 串联分压</text><text x="1300" y="221" font-size="15" fill="#233444" font-weight="400" text-anchor="start">动力与 CAN 分别识别</text><text x="1300" y="333" font-size="16" fill="#c33c38" font-weight="600" text-anchor="start">25.2 V 不可直连 Jetson</text><text x="1300" y="361" font-size="15" fill="#233444" font-weight="400" text-anchor="start">降压模块电气参数待确认</text><rect x="28" y="430" width="1504" height="262" rx="14" fill="#f7f9fc" stroke="#e0e7ed"/><text x="52" y="463" font-size="20" fill="#8495a5" font-weight="600" text-anchor="start">02</text><text x="96" y="463" font-size="22" fill="#233444" font-weight="600" text-anchor="start">双路 CAN</text><text x="96" y="490" font-size="15" fill="#607183" font-weight="400" text-anchor="start">USB2CAN 的供电来自 USB；GH1.25 2P 仅 CANH/CANL，不输入电池电压。</text><rect x="54" y="535" width="234" height="98" rx="8" fill="#fff" stroke="#cad4dd"/><text x="171.0" y="564" font-size="18" fill="#1c8967" font-weight="600" text-anchor="middle">USB2CANFD Dual</text><text x="171.0" y="588" font-size="14" fill="#68788a" font-weight="400" text-anchor="middle">两条独立总线 · 近端各 120 Ω</text><rect x="445" y="521" width="238" height="65" rx="8" fill="#fff" stroke="#cad4dd"/><text x="564.0" y="550" font-size="18" fill="#233444" font-weight="600" text-anchor="middle">左髋 J4310 → 左膝 J4310</text><text x="564.0" y="574" font-size="14" fill="#68788a" font-weight="400" text-anchor="middle">中间不加终端</text><rect x="778" y="521" width="217" height="65" rx="8" fill="#fff" stroke="#cad4dd"/><text x="886.5" y="550" font-size="18" fill="#233444" font-weight="600" text-anchor="middle">左轮 H6215</text><text x="886.5" y="574" font-size="14" fill="#68788a" font-weight="400" text-anchor="middle">末端 120 Ω：核实是否已内置</text><rect x="445" y="608" width="238" height="65" rx="8" fill="#fff" stroke="#cad4dd"/><text x="564.0" y="637" font-size="18" fill="#233444" font-weight="600" text-anchor="middle">右髋 J4310 → 右膝 J4310</text><text x="564.0" y="661" font-size="14" fill="#68788a" font-weight="400" text-anchor="middle">中间不加终端</text><rect x="778" y="608" width="217" height="65" rx="8" fill="#fff" stroke="#cad4dd"/><text x="886.5" y="637" font-size="18" fill="#233444" font-weight="600" text-anchor="middle">右轮 H6215</text><text x="886.5" y="661" font-size="14" fill="#68788a" font-weight="400" text-anchor="middle">末端 120 Ω：核实是否已内置</text><path d="M 288,554 L 445,554" fill="none" stroke="#1c8967" stroke-width="3" stroke-linejoin="round" marker-end="url(#can)"/><path d="M 288,612 L 348,612 L 348,641 L 445,641" fill="none" stroke="#1c8967" stroke-width="3" stroke-linejoin="round" marker-end="url(#can)"/><path d="M 683,554 L 778,554" fill="none" stroke="#1c8967" stroke-width="3" stroke-linejoin="round" marker-end="url(#can)"/><path d="M 683,641 L 778,641" fill="none" stroke="#1c8967" stroke-width="3" stroke-linejoin="round" marker-end="url(#can)"/><text x="315" y="544" font-size="15" fill="#1c8967" font-weight="600" text-anchor="start">CAN 1</text><text x="362" y="630" font-size="15" fill="#1c8967" font-weight="600" text-anchor="start">CAN 2</text><text x="1076" y="548" font-size="18" fill="#233444" font-weight="600" text-anchor="start">两端各 120 Ω；每路断电约 60 Ω</text><text x="1076" y="581" font-size="16" fill="#233444" font-weight="400" text-anchor="start">CAN 双绞线沿各腿连续布置</text><text x="1076" y="610" font-size="16" fill="#233444" font-weight="400" text-anchor="start">左右 H/L 不互连；节点 ID 各自唯一</text><text x="1076" y="639" font-size="16" fill="#233444" font-weight="400" text-anchor="start">运动接口保留弯折环与两侧应力释放</text><rect x="28" y="712" width="1504" height="355" rx="14" fill="#f7f9fc" stroke="#e0e7ed"/><text x="52" y="745" font-size="20" fill="#8495a5" font-weight="600" text-anchor="start">03</text><text x="96" y="745" font-size="22" fill="#233444" font-weight="600" text-anchor="start">Jetson 主机接口与前后面板</text><text x="96" y="772" font-size="15" fill="#607183" font-weight="400" text-anchor="start">外露扩展坞四口全部留给外接设备；内部 IMU 使用 Jetson Type-C Host。</text><rect x="54" y="820" width="216" height="155" rx="8" fill="#fff" stroke="#cad4dd"/><text x="162.0" y="849" font-size="18" fill="#2776be" font-weight="600" text-anchor="middle">Jetson Orin Nano</text><text x="162.0" y="873" font-size="14" fill="#68788a" font-weight="400" text-anchor="middle">4 × Type-A + Type-C Host</text><text x="162" y="919" font-size="15" fill="#233444" font-weight="400" text-anchor="middle">每个双层 Type-A 座</text><text x="162" y="945" font-size="15" fill="#233444" font-weight="400" text-anchor="middle">合计 VBUS 限制 3 A</text><rect x="444" y="793" width="280" height="61" rx="8" fill="#fff" stroke="#cad4dd"/><text x="584.0" y="822" font-size="18" fill="#233444" font-weight="600" text-anchor="middle">D435</text><text x="584.0" y="846" font-size="14" fill="#68788a" font-weight="400" text-anchor="middle">USB 3.x A→C · 前面板上方</text><path d="M 270,822 L 444,822" fill="none" stroke="#2776be" stroke-width="3" stroke-linejoin="round" marker-end="url(#usb)"/><text x="295" y="811" font-size="14" fill="#2776be" font-weight="400" text-anchor="start">Type-A · 正Y座下</text><rect x="444" y="862" width="280" height="61" rx="8" fill="#fff" stroke="#cad4dd"/><text x="584.0" y="891" font-size="18" fill="#233444" font-weight="600" text-anchor="middle">USB2CANFD Dual</text><text x="584.0" y="915" font-size="14" fill="#68788a" font-weight="400" text-anchor="middle">USB A→C · 供电 + 双路通信</text><path d="M 270,891 L 444,891" fill="none" stroke="#2776be" stroke-width="3" stroke-linejoin="round" marker-end="url(#usb)"/><text x="295" y="880" font-size="14" fill="#2776be" font-weight="400" text-anchor="start">Type-A · 负Y座上</text><rect x="444" y="931" width="280" height="61" rx="8" fill="#fff" stroke="#cad4dd"/><text x="584.0" y="960" font-size="18" fill="#233444" font-weight="600" text-anchor="middle">HI13R2-USB</text><text x="584.0" y="984" font-size="14" fill="#68788a" font-weight="400" text-anchor="middle">C→C 数据线 · 原点保持居中</text><path d="M 270,960 L 444,960" fill="none" stroke="#2776be" stroke-width="3" stroke-linejoin="round" marker-end="url(#usb)"/><text x="295" y="949" font-size="14" fill="#2776be" font-weight="400" text-anchor="start">Type-C Host</text><rect x="986" y="793" width="276" height="61" rx="8" fill="#fff" stroke="#cad4dd"/><text x="1124.0" y="822" font-size="18" fill="#233444" font-weight="600" text-anchor="middle">后部四口 USB 扩展坞</text><text x="1124.0" y="846" font-size="14" fill="#68788a" font-weight="400" text-anchor="middle">原线150 mm + 延长线250 mm</text><rect x="986" y="880" width="276" height="61" rx="8" fill="#fff" stroke="#cad4dd"/><text x="1124.0" y="909" font-size="18" fill="#233444" font-weight="600" text-anchor="middle">5 寸前屏 USB</text><text x="1124.0" y="933" font-size="14" fill="#68788a" font-weight="400" text-anchor="middle">5 V 供电 / 触摸版本待核实</text><rect x="986" y="986" width="276" height="61" rx="8" fill="#fff" stroke="#cad4dd"/><text x="1124.0" y="1015" font-size="18" fill="#233444" font-weight="600" text-anchor="middle">5 寸前屏 HDMI</text><text x="1124.0" y="1039" font-size="14" fill="#68788a" font-weight="400" text-anchor="middle">视频 · DP→HDMI 线或转接器</text><path d="M 270,966 L 314,966 L 314,1040 L 756,1040 L 756,824 L 986,824" fill="none" stroke="#2776be" stroke-width="3" stroke-linejoin="round" marker-end="url(#usb)"/><path d="M 270,970 L 303,970 L 303,1048 L 780,1048 L 780,910 L 986,910" fill="none" stroke="#2776be" stroke-width="3" stroke-linejoin="round" marker-end="url(#usb)"/><path d="M 270,975 L 287,975 L 287,1057 L 954,1057 L 954,1017 L 986,1017" fill="none" stroke="#7657a8" stroke-width="3" stroke-linejoin="round" marker-end="url(#video)"/><text x="797" y="813" font-size="14" fill="#2776be" font-weight="400" text-anchor="start">Type-A · 正Y座上</text><text x="797" y="899" font-size="14" fill="#2776be" font-weight="400" text-anchor="start">Type-A · 负Y座下</text><text x="793" y="1005" font-size="14" fill="#7657a8" font-weight="400" text-anchor="start">DisplayPort</text><text x="1293" y="817" font-size="16" fill="#233444" font-weight="600" text-anchor="start">104 × 30 × 10 mm</text><text x="1293" y="845" font-size="15" fill="#233444" font-weight="400" text-anchor="start">速率 / 总供电能力待核实</text><text x="1293" y="905" font-size="16" fill="#233444" font-weight="400" text-anchor="start">两条线：USB + 视频</text><text x="1293" y="933" font-size="15" fill="#233444" font-weight="400" text-anchor="start">USB-C 不输出显示信号</text><text x="1293" y="1012" font-size="15" fill="#233444" font-weight="400" text-anchor="start">刷机时先拔 Type-C IMU</text><rect x="28" y="1085" width="1504" height="121" rx="12" fill="#fff7e8" stroke="#eed9ae"/><text x="52" y="1118" font-size="21" fill="#835b20" font-weight="600" text-anchor="start">机械包络已定义，电气放行仍有明确边界</text><text x="52" y="1150" font-size="17" fill="#233444" font-weight="400" text-anchor="start">需核实：主开关 DC 分断 / LED 电压，转换器输入与功率，DC 母座极性与载流，分配板原理图，USB 总负载。</text><text x="52" y="1179" font-size="17" fill="#233444" font-weight="400" text-anchor="start">E626S 持续 6 A；J4310 V1.1 手册最低工作电压按更严格 20 V 审查。不能据此宣称已具备跳跃供电能力。</text><text x="38" y="1230" font-size="14" fill="#607183" font-weight="400" text-anchor="start">功能示意，非引脚接线图。依据与未确认项见 ELECTRICAL_INTEGRATION.md。</text></g>
</svg>